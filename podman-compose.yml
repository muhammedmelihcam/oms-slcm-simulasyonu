services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /app/data/oms_slcm.db
      # JVM memory + Hikari pool limits applied directly via JAVA_TOOL_OPTIONS
      # at the container-deployment level (this file), rather than through a
      # custom app-specific env var that application.yml would have to read -
      # per spec. The pool size is already 1 in application.yml (SQLite is
      # single-writer); this makes that override explicit at deploy time too.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -Dspring.datasource.hikari.maximum-pool-size=1"
    volumes:
      # Host bind mount, not an anonymous/named volume: the SQLite file must
      # survive container restarts on a directory the host actually owns.
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      # Host side is >=1024 on purpose: rootless Podman can't publish
      # privileged host ports (<1024) without extra sysctl setup. Nginx
      # still listens on 80 *inside* the container.
      - "8081:80"
    depends_on:
      - backend
