server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same reverse-proxy role Vite's dev server proxy plays locally (see
    # vite.config.js) - frontend code always calls relative /api/v1/...
    # paths, so no CORS config is ever needed on the backend.
    #
    # "backend" is resolved through a variable (not a literal hostname in
    # proxy_pass) with a short-lived resolver cache: a bare hostname in
    # proxy_pass is resolved once at nginx startup and cached forever, which
    # breaks (502) the moment the backend container restarts and gets a new
    # IP from Podman's network. ${NGINX_LOCAL_RESOLVERS} is filled in at
    # container startup (envsubst, via this file being a *.template - see
    # Containerfile) by the official nginx image's own
    # docker-entrypoint.d/15-local-resolvers.envsh, which reads the
    # nameserver Podman wrote into /etc/resolv.conf. Opted in via
    # NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 (also in the Containerfile).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    location /api/ {
        set $backend_upstream "backend:8080";
        # With a variable in proxy_pass, nginx does NOT do its usual
        # "replace the matched location prefix" rewriting - the URI has to
        # be passed through explicitly. $request_uri is the original,
        # unmodified path+query, which is exactly what we want (1:1 mapping,
        # no rewriting - frontend and backend agree on the same /api/v1/... paths).
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-/api route resolves to index.html so
    # client-side state (React) decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
