server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same reverse-proxy role Vite's dev server proxy plays locally (see
    # vite.config.js) - frontend code always calls relative /api/v1/...
    # paths, so no CORS config is ever needed on the backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-/api route resolves to index.html so
    # client-side state (React) decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
