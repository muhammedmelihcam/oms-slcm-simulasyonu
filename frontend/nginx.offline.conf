# Host-network variant for the corporate server: rootless Podman's custom
# bridge networks (needed for container-name DNS like "backend:8080") require
# a live D-Bus session that isn't available over a plain SSH login there, so
# this container runs with --network host instead. That means no network
# namespace/isolation and no name resolution needed - nginx listens directly
# on the host's 3000 (rootless can't bind <1024, same reason 8081 was used
# for the backend previously) and reaches the backend via plain loopback,
# since --network host makes 127.0.0.1 mean the host's own loopback.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-/api route resolves to index.html so
    # client-side state (React) decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
